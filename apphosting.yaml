# Configuración de Firebase App Hosting
# Docs: https://firebase.google.com/docs/app-hosting/configure
#
# Las variables de entorno (ADMIN_USER, AUTH_SECRET, ADMIN_PASSWORD)
# se configuran desde la consola de App Hosting (sección "Variables de entorno").
# La conexión a Firestore usa credenciales automáticas (ADC), sin clave.

runConfig:
  minInstances: 0
  maxInstances: 2
